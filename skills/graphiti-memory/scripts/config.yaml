# Graphiti MCP Server Configuration
# This file supports environment variable expansion using ${VAR_NAME} or ${VAR_NAME:default_value}
#
# IMPORTANT: Set SEMAPHORE_LIMIT environment variable to control episode processing concurrency
# Default: 10 (suitable for OpenAI Tier 3, mid-tier Anthropic)
# See README.md "Concurrency and LLM Provider 429 Rate Limit Errors" section for tuning guidance

server:
  transport: "http"  # Options: stdio, sse (deprecated), http
  host: "0.0.0.0"
  port: 8000
  
llm:
  provider: "openai"  # 2026-09-15: OpenRouter через OpenAI-совместимый API (нативный anthropic-клиент в образе сломан: unexpected kwarg temperature; OpenAI напрямую без кредитов)
  model: ${MODEL_NAME:gpt-5.5}
  max_tokens: 4096
  # Use json_object for OpenAI-compatible providers that accept json_schema
  # but do not reliably enforce the requested Pydantic schema.
  structured_output_mode: ${LLM_STRUCTURED_OUTPUT_MODE:json_schema}
  
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}
      
    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
      deployment_name: ${AZURE_OPENAI_DEPLOYMENT}
      use_azure_ad: ${USE_AZURE_AD:false}
      
    anthropic:
      api_key: ${ANTHROPIC_API_KEY}
      api_url: ${ANTHROPIC_API_URL:https://api.anthropic.com}
      max_retries: 3
      
    gemini:
      api_key: ${GOOGLE_API_KEY}
      project_id: ${GOOGLE_PROJECT_ID:}
      location: ${GOOGLE_LOCATION:us-central1}
      
    groq:
      api_key: ${GROQ_API_KEY}
      api_url: ${GROQ_API_URL:https://api.groq.com/openai/v1}

embedder:
  provider: "openai"  # Options: openai, azure_openai, gemini, voyage
  model: ${EMBEDDER_MODEL:qwen/qwen3-embedding-8b}
  dimensions: ${EMBEDDER_DIMENSIONS:4096}
  
  providers:
    openai:
      api_key: ${EMBEDDER_API_KEY:local}
      api_url: ${EMBEDDER_API_URL:http://172.17.0.1:18081/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}
      
    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_EMBEDDINGS_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
      deployment_name: ${AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT}
      use_azure_ad: ${USE_AZURE_AD:false}
      
    gemini:
      api_key: ${GOOGLE_API_KEY}
      project_id: ${GOOGLE_PROJECT_ID:}
      location: ${GOOGLE_LOCATION:us-central1}
      
    voyage:
      api_key: ${VOYAGE_API_KEY}
      api_url: ${VOYAGE_API_URL:https://api.voyageai.com/v1}
      model: "voyage-3"

database:
  provider: "falkordb"  # Default: falkordb. Options: neo4j, falkordb

  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://localhost:6379}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:default_db}

    neo4j:
      uri: ${NEO4J_URI:bolt://localhost:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}
      database: ${NEO4J_DATABASE:neo4j}
      use_parallel_runtime: ${USE_PARALLEL_RUNTIME:false}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:mcp_user}
  entity_types:
    - name: "Server"
      description: "A physical or virtual machine (VPS) identified by IP address and/or hostname/nickname. IP, hostname and nickname of the same machine are ONE entity (e.g. 201.51.23.17 = прод = Амстердам). Do NOT create entities for network interfaces, ports or firewall chains."
    - name: "Service"
      description: "Named software component running on a server: container, daemon, systemd unit, bot, cron job, database, proxy, script (n8n, Supabase, nginx, Telegram bot, ewa-sync-standby)."
    - name: "Project"
      description: "Business or technical project/initiative of the owner (Лига косарей, Музей Дворника, паспорт участка, Сердце столицы)."
    - name: "Domain"
      description: "DNS domain, site or URL endpoint (ewa.pro, grafana.nkt.ru.com, mail.ewa.pro)."
    - name: "Incident"
      description: "A dated event: outage, failure, security finding, migration, reboot, audit, decision. Always carries a date."
    - name: "Credential"
      description: "A named secret (token, password, key, API access) referenced ONLY by its name, purpose and storage path — never by value. Do not create entities for environment variable names alone."
    - name: "Runbook"
      description: "Recipe, command sequence or standard operating procedure (how to restore, how to sync, how to check)."
    - name: "Rule"
      description: "Owner's rules, preferences and working-style instructions for the assistant (what to confirm, how to report, terminology)."
    - name: "Human"
      description: "An individual human (owner, operators, clients, contractors)."
    - name: "Company"
      description: "Company, provider, institution (Timeweb, Beget, Selectel, Bitrix, Avito)."
    - name: "Tool"
      description: "Software product, model, API or skill used by the owner or assistant (Claude Code, OpenRouter, Graphiti, skill avito-ads). Use only for named tools, not for file paths."
    - name: "Publication"
      description: "A named book, textbook, manual, spec or official document (Баранов «ЕГЭ-2027, 50 вариантов», методичка ФИПИ 2026, спека Posiflora API). Name it by author + title; it is NOT a Company and NOT a Human. (Do not use the name Document — reserved by the MCP server for a rich model.)"

  # 16.09.2026: типы связей (doc-only, без атрибутов → без лишних LLM-вызовов). Описание говорит модели, какие связи
  # ВЗАИМОИСКЛЮЧАЮЩИЕ (новое значение вытесняет старое), а какие НАКОПИТЕЛЬНЫЕ (несколько верны одновременно) —
  # это главный ориентир для шага «противоречие или уточнение». Имена не пересекаются с rich-моделями src/models/edge_types.py.
  edge_types:
    - name: "RUNS_ON"
      description: "EXCLUSIVE: a service, bot, container or unit runs on a specific server (ege-bot RUNS_ON 201.51.23.17). A move to another server replaces the old fact."
    - name: "LISTENS_ON"
      description: "EXCLUSIVE per service: a service listens on a port/address (proxy LISTENS_ON 172.17.0.1:18004). A changed port replaces the old fact."
    - name: "LOCATED_IN"
      description: "EXCLUSIVE: a server is hosted by a provider / in a city (201.51.23.17 LOCATED_IN Timeweb Амстердам)."
    - name: "CONFIGURED_WITH"
      description: "EXCLUSIVE per setting: an entity uses a specific model, version, mode or parameter (graphiti CONFIGURED_WITH gemini-2.5-flash-lite). A new value of the same setting replaces the old one."
    - name: "MANAGED_BY"
      description: "EXCLUSIVE: who is responsible for / owns an entity (сервер Лиги MANAGED_BY Артём). A hand-over replaces the old fact."
    - name: "REPLACED_BY"
      description: "TEMPORAL: the old entity was replaced by the new one (Beget-Латвия REPLACED_BY 201.51.23.17). Implies the old one is no longer in use."
    - name: "STORES_DATA_IN"
      description: "CUMULATIVE: an entity writes/keeps data in a database, file or volume (бот STORES_DATA_IN progress.db). Several targets can be true at once."
    - name: "USES"
      description: "CUMULATIVE: an entity uses a tool, service, proxy, model or skill. Many can be true at once; a new USES does not cancel an old one unless the text says so."
    - name: "DEPENDS_ON"
      description: "CUMULATIVE: an entity needs another one to work (НСПД-паспорт DEPENDS_ON Selectel-прокси)."
    - name: "HAS_ACCESS_TO"
      description: "CUMULATIVE: a person or service has access to a resource (ArtemN HAS_ACCESS_TO /root read-only)."
    - name: "PART_OF"
      description: "CUMULATIVE: an entity is a component or member of a bigger one (право PART_OF ЕГЭ по обществознанию)."
    - name: "SERVES_DOMAIN"
      description: "CUMULATIVE: a service or server serves a DNS domain / site."
    - name: "AUTHORED"
      description: "CUMULATIVE: a person or company authored/published a publication or script."
    - name: "CAUSED"
      description: "CUMULATIVE: an event or condition caused an incident or failure (парольный SSH CAUSED аудит-находка)."
    - name: "TRIED_AND_FAILED"
      description: "CUMULATIVE, HISTORICAL: an approach was tried and did not work (локальный TEI TRIED_AND_FAILED массовая загрузка). A failed attempt never contradicts other facts."
    - name: "RULE_FOR"
      description: "CUMULATIVE: an owner's rule or preference applies to a project, tool or the assistant."

  # Optional constraint on which edge types may connect which entity types.
  # 'Entity' acts as a wildcard for either endpoint. Mirrors graphiti-core's
  # edge_type_map. Leave empty to allow any configured edge type anywhere.
  # edge_type_map:
  #   - source: "Person"
  #     target: "Organization"
  #     edge_types: ["WorksFor"]
  #   - source: "Entity"
  #     target: "Location"
  #     edge_types: ["LocatedAt"]
